
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#fff7ef">
<title>Scratch & Win | ChefDesk</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/customer.css">
</head>
<body>
<header class="navbar">
<a href="../Dashboard/index.html" class="logo">ChefDesk<span>.</span></a>
<a href="../Dashboard/index.html" class="back-btn">← Dashboard</a>
</header>
<main class="game-page">
<div class="decoration left-food">🧁</div>
<div class="decoration right-food">☕</div>
<div class="leaf leaf-one">🌿</div>
<div class="leaf leaf-two">🍃</div>
<div class="confetti confetti-one">✦</div>
<div class="confetti confetti-two">✦</div>
<div class="game-heading">
<h1>Scratch & <span>Win!</span></h1>
<p>A delicious surprise is waiting underneath.</p>
</div>
<section class="scratch-card">
<div class="gift-icon">🎁</div>
<h2>Scratch to discover!</h2>
<p class="instructions">Scratch the silver area with your finger or mouse.</p>
<div class="scratch-frame">
<div class="prize-content" id="prizeContent">
<div class="prize-icon" id="prizeIcon">🎁</div>
<p class="prize-small">YOU DISCOVERED</p>
<h3 id="prizeName">Your Surprise</h3>
<p id="prizeDescription">A delicious reward awaits!</p>
</div>
<canvas id="scratchCanvas" aria-label="Scratch the silver card to reveal your result"></canvas>
</div>
<div class="progress-row">
<div class="progress-track">
<div class="progress-fill" id="progressFill"></div>
</div>
<strong id="progressPercent">0%</strong>
</div>
<p class="scratch-progress" id="progressText">Scratched: 0%</p>
<button class="reveal-link" id="revealBtn" type="button">Can't scratch? Reveal result</button>
<div id="finishedActions" class="finished-actions" hidden>
<p id="winMessage" role="status" aria-live="polite"></p>
<button id="playAgainBtn" class="play-again" type="button">Play Again</button>
</div>
</section>
<p class="game-disclaimer">Demo game • Rewards are for preview only</p>
</main>

<script src="../shared/customer.js"></script>
<script src="../shared/claim-reward.js"></script>
<script src="script.js"></script>

</body>
</html>
