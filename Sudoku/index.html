
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sudoku | ChefDesk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
<a href="../Dashboard/index.html" class="logo">Chef<span>Desk.</span></a>
<a href="../Dashboard/index.html" class="back">← Dashboard</a>
</header>
<main class="page">
<div class="decor basil">🌿</div>
<div class="decor pepper">🧂</div>
<div class="decor leaves">🍃</div>
<div class="heading">
<p>DAILY PUZZLE</p>
<h1>Sudo<span>ku</span></h1>
<div class="subtitle">Challenge your mind. One puzzle at a time.</div>
</div>
<section class="game">
<div class="settings">
<label>Difficulty
<select id="difficulty">
<option value="easy">Easy</option>
<option value="medium" selected>Medium</option>
<option value="hard">Hard</option>
</select>
</label>
<button id="newGame" class="new-game">↻ New Game</button>
</div>
<div class="stats">
<div class="stat"><span>◷</span><div><small>TIME</small><strong id="timer">00:00</strong></div></div>
<div class="stat"><span>⚠</span><div><small>MISTAKES</small><strong id="mistakes">0</strong></div></div>
<div class="stat"><span>♧</span><div><small>HINTS LEFT</small><strong id="hints">3</strong></div></div>
</div>
</section>
<p class="message" id="message" role="status">Select a square to begin.</p>
<div class="board" id="board" role="grid" aria-label="Sudoku puzzle"></div>
<div class="keypad" id="keypad">
<button data-number="1">1</button>
<button data-number="2">2</button>
<button data-number="3">3</button>
<button data-number="4">4</button>
<button data-number="5">5</button>
<button data-number="6">6</button>
<button data-number="7">7</button>
<button data-number="8">8</button>
<button data-number="9">9</button>
<button id="erase">⌫ Erase</button>
<button id="hint">💡 Hint</button>
</div>
</main>
<script src="script.js"></script>
</body>
</html>
