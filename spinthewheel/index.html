
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#fff7ef">
<title>Spin & Win | ChefDesk</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/customer.css">
</head>
<body>
<header class="navbar">
<a href="../Dashboard/index.html" class="logo">ChefDesk<span>.</span></a>
<a href="../Dashboard/index.html" class="back-btn">← Dashboard</a>
</header>
<main class="game-page">
<div class="decoration decoration-one">🍝</div>
<div class="decoration decoration-two">🍹</div>
<div class="decoration decoration-three">🍰</div>
<div class="decoration decoration-four">🌿</div>
<div class="game-heading">
<p class="eyebrow">CHEFDESK REWARDS</p>
<h1>Spin & <span>Win!</span></h1>
<p>Good food deserves a little surprise.</p>
</div>
<div class="game-layout">
<section class="wheel-section" aria-label="Spin the reward wheel">
<div class="wheel-container">
<div class="wheel-pointer"></div>
<div class="wheel-rotator" id="wheelRotator">
<canvas id="wheelCanvas" width="700" height="700"></canvas>
</div>
<button id="spinBtn" class="spin-button" type="button">SPIN</button>
</div>
<div class="wheel-stand"></div>
<div class="spin-note">🎁 One spin per bill. Good luck!</div>
<div id="status" class="status" role="status" aria-live="polite">Tap SPIN to discover your surprise!</div>
</section>
<aside class="rewards-panel">
<h2><span>🎁</span> Today's Rewards</h2>
<div id="rewardsList" class="rewards-list"></div>
<p class="panel-note">Rewards shown are for the game preview.</p>
</aside>
</div>
</main>
<div id="resultOverlay" class="result-overlay" hidden>
<div class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
<div class="result-icon" id="resultIcon">🎉</div>
<p class="result-label">YOUR SPIN RESULT</p>
<h2 id="resultTitle">Congratulations!</h2>
<p id="resultMessage"></p>
<button id="closeResult" type="button">Continue Playing</button>
</div>
</div>

<script src="../shared/customer.js"></script>
<script src="../shared/claim-reward.js"></script>
<script src="script.js"></script>

</body>
</html>
